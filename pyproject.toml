[project]
name = "ms-plan-nutricional"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.111,<0.120",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # Cliente HTTP de las pruebas de integracion. Llega de forma transitiva con
    # fastapi[standard], pero se declara aqui para que la suite sea reproducible.
    "httpx>=0.27",
    "pact-python>=3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Pruebas
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# asyncio_mode = "auto": los tests `async def` no necesitan decorador. Los casos
# de uso de este microservicio son todos asíncronos.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: prueba de integracion; requiere PostgreSQL levantado (se omite si no lo esta)",
    "contract: prueba de contrato con Pact (el consumer genera pacts/ y el provider los verifica)",
]

# ---------------------------------------------------------------------------
# Cobertura de código
# ---------------------------------------------------------------------------

[tool.coverage.run]
# `source_pkgs` (y no `source`) es lo que hace que la cobertura resuelva bien el
# paquete con el layout src/; con `source` es habitual obtener un falso 0 %.
source_pkgs = ["plan_nutricional"]
branch = true
# `infrastructure/` y `presentation/` ya NO se excluyen: son precisamente las
# capas que ejercitan las pruebas de integración (tests/integration/). Solo se
# omiten los `__init__.py`, que son reexportaciones sin lógica.
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"
