# Configuración del análisis de SonarCloud (lo ejecuta .github/workflows/ci.yml).
# organization y projectKey deben coincidir EXACTAMENTE con los de sonarcloud.io.
sonar.organization=luishumbertonavarro
sonar.projectKey=luishumbertonavarro_ms-plan-nutricional
sonar.projectName=ms-plan-nutricional

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Reporte de cobertura generado por pytest-cov en el CI.
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=htmlcov-unit/**,playwright/**,node_modules/**
